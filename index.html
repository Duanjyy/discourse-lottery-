<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS 26 Liquid TabBar Effect</title>
    <style>
        :root {
            --bg-color: #e5e7eb;
            --text-inactive: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
        }

        /* Phone frame simulation */
        .device {
            width: 390px;
            height: 844px;
            background: #f8f9fa;
            border-radius: 44px;
            border: 8px solid #ffffff;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25), 0 0 0 1px #d1d5db;
            position: relative;
            overflow: hidden;
        }

        /* Background map pattern */
        .map-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #f0f2f5;
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: 0;
        }

        /* Top Search UI to match the GIF */
        .top-card {
            position: absolute;
            top: 48px;
            left: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px;
            z-index: 1;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .location {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 16px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            margin-right: 10px;
        }

        .highlight {
            color: #10b981;
            font-weight: 500;
        }

        .search-box {
            display: flex;
            align-items: center;
            border: 2px solid #ff7b54;
            border-radius: 100px;
            padding: 12px 16px;
            margin-bottom: 16px;
            background: #fff;
        }

        .search-icon {
            width: 20px;
            height: 20px;
            color: #1f2937;
            margin-right: 10px;
        }

        .placeholder {
            font-size: 16px;
            font-weight: 600;
            color: #1f2937;
            flex: 1;
        }

        .history-tag {
            background: #f3f4f6;
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 12px;
            color: #4b5563;
        }

        .action-row {
            display: flex;
            justify-content: space-between;
        }

        .action-btn {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #6b7280;
            padding: 6px 0;
            font-weight: 500;
        }

        .action-btn.active {
            color: #8b5cf6;
        }

        .action-btn .icon {
            margin-right: 4px;
            font-size: 16px;
        }

        /* --- Tab Bar Styles --- */
        .tab-bar {
            position: absolute;
            bottom: 34px;
            left: 16px;
            right: 16px;
            height: 76px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 38px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08), inset 0 0 0 1px rgba(255,255,255,0.6);
            z-index: 10;
        }

        .indicator-track {
            position: absolute;
            top: 8px;
            bottom: 8px;
            left: 8px;
            right: 8px;
            z-index: 0;
            pointer-events: none;
        }

        .indicator {
            position: absolute;
            top: 0;
            bottom: 0;
            border-radius: 30px;
            background-color: #ffeae3;
            /* Default transition, will be overridden by JS */
            transition: all 0.4s ease;
        }

        .tab {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
            cursor: pointer;
        }

        .icon-container {
            width: 28px;
            height: 28px;
            margin-bottom: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-inactive);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .icon-svg {
            width: 24px;
            height: 24px;
        }

        .tab span {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-inactive);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Active animations */
        .tab.active .icon-container {
            transform: translateY(-4px) scale(1.15);
        }

        .tab.active span {
            transform: translateY(-2px);
            font-weight: 700;
        }

        /* Click feedback */
        .tab:active .icon-container {
            transform: scale(0.9);
        }
    </style>
</head>
<body>

<div class="device">
    <div class="map-bg"></div>
    
    <div class="top-card">
        <div class="location">
            <div class="dot"></div>
            <span>从 <span class="highlight">狮子村第一村民小组</span> 上车</span>
        </div>
        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <span class="placeholder">输入目的地</span>
            <div class="history-tag">去: 步步高(人民广场店)</div>
        </div>
        <div class="action-row">
            <div class="action-btn active"><span class="icon">🎙️</span> AI 叫车</div>
            <div class="action-btn"><span class="icon">🕒</span> 预约</div>
            <div class="action-btn"><span class="icon">👤</span> 帮人叫车</div>
            <div class="action-btn"><span class="icon">✈️</span> 接送机</div>
        </div>
    </div>

    <nav class="tab-bar">
        <div class="indicator-track">
            <div class="indicator" id="indicator"></div>
        </div>
        
        <div class="tab active" data-color="#ff5722" data-bg="#ffeae3" onclick="selectTab(0, this)">
            <div class="icon-container">
                <svg viewBox="0 0 24 24" fill="currentColor" class="icon-svg">
                    <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.04 3H5.81l1.04-3zM19 17H5v-4.66l.12-.34h13.77l.11.34V17z"/>
                    <circle cx="7.5" cy="14.5" r="1.5"/><circle cx="16.5" cy="14.5" r="1.5"/>
                </svg>
            </div>
            <span>首页</span>
        </div>
        
        <div class="tab" data-color="#10b981" data-bg="#d1fae5" onclick="selectTab(1, this)">
            <div class="icon-container">
                <svg viewBox="0 0 24 24" fill="currentColor" class="icon-svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
                    <path d="M8 10.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM16 10.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM12 15.5c-2.33 0-4.31-1.46-5.11-3.5h10.22c-.8 2.04-2.78 3.5-5.11 3.5z"/>
                </svg>
            </div>
            <span>车主</span>
        </div>
        
        <div class="tab" data-color="#2563eb" data-bg="#dbeafe" onclick="selectTab(2, this)">
            <div class="icon-container">
                <svg viewBox="0 0 24 24" fill="currentColor" class="icon-svg">
                    <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
                </svg>
            </div>
            <span>订票</span>
        </div>
        
        <div class="tab" data-color="#4b5563" data-bg="#e5e7eb" onclick="selectTab(3, this)">
            <div class="icon-container">
                <svg viewBox="0 0 24 24" fill="currentColor" class="icon-svg">
                    <path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
                </svg>
            </div>
            <span>送货</span>
        </div>
        
        <div class="tab" data-color="#0891b2" data-bg="#cffafe" onclick="selectTab(4, this)">
            <div class="icon-container">
                <svg viewBox="0 0 24 24" fill="currentColor" class="icon-svg">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
            <span>我的</span>
        </div>
    </nav>
</div>

<script>
    const tabs = document.querySelectorAll('.tab');
    const indicator = document.getElementById('indicator');
    let currentIndex = 0;

    function updateIndicator(targetTab, targetIndex, previousIndex, isInit = false) {
        const track = document.querySelector('.indicator-track');
        const trackRect = track.getBoundingClientRect();
        const tabRect = targetTab.getBoundingClientRect();
        
        // padding to make the indicator slightly smaller than the tab space
        const padding = 6;
        const leftPos = tabRect.left - trackRect.left + padding;
        const rightPos = trackRect.right - tabRect.right + padding;
        
        if (isInit) {
            indicator.style.transition = 'none';
        } else {
            const movingRight = targetIndex > previousIndex;
            // The secret to the liquid/gooey stretch effect:
            // Fast transition for the leading edge, delayed transition for the trailing edge.
            if (movingRight) {
                indicator.style.transition = 'right 0.35s cubic-bezier(0.25, 1, 0.5, 1), left 0.45s cubic-bezier(0.25, 1, 0.5, 1) 0.08s, background-color 0.4s ease';
            } else {
                indicator.style.transition = 'left 0.35s cubic-bezier(0.25, 1, 0.5, 1), right 0.45s cubic-bezier(0.25, 1, 0.5, 1) 0.08s, background-color 0.4s ease';
            }
            
            // Force reflow to ensure the transition property is updated before layout changes
            void indicator.offsetWidth;
        }
        
        // Apply new positions
        indicator.style.left = \`\${leftPos}px\`;
        indicator.style.right = \`\${rightPos}px\`;
        
        // Apply colors
        const themeBg = targetTab.getAttribute('data-bg');
        indicator.style.backgroundColor = themeBg;
        
        tabs.forEach((tab, i) => {
            const icon = tab.querySelector('.icon-container');
            const text = tab.querySelector('span');
            const color = tab.getAttribute('data-color');
            
            if (i === targetIndex) {
                icon.style.color = color;
                text.style.color = color;
            } else {
                icon.style.color = 'var(--text-inactive)';
                text.style.color = 'var(--text-inactive)';
            }
        });
    }

    function selectTab(index, element) {
        if (index === currentIndex) return;
        
        const previousIndex = currentIndex;
        currentIndex = index;
        
        tabs.forEach(tab => tab.classList.remove('active'));
        element.classList.add('active');
        
        updateIndicator(element, index, previousIndex, false);
    }

    // Initialize on load and handle resize
    function init() {
        updateIndicator(tabs[currentIndex], currentIndex, currentIndex, true);
    }

    window.addEventListener('load', init);
    window.addEventListener('resize', init);
</script>

</body>
</html>
